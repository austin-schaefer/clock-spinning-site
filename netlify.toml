# Netlify configuration for Clock Spinning Gatsby site

[build]
  # Build command
  command = "npm run build"

  # Directory with the static files generated by Gatsby
  publish = "public"

# Build environment variables
[build.environment]
  NODE_VERSION = "22"
  GATSBY_EXPERIMENTAL_PAGE_BUILD_ON_DATA_CHANGES = "true"

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# Headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache static assets for 1 year
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache page-data for 1 day
[[headers]]
  for = "/page-data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Cache Gatsby chunks for 1 year
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 404 redirect
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Optional: Force HTTPS (uncomment when custom domain is configured)
